[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "file-integrity-jira-automation"
version = "2.0.0"
description = "Tamper-evident file integrity monitoring with durable security events and Jira incident automation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Shadin K V" }
]
dependencies = [
  "python-dotenv==1.2.3",
  "requests==2.32.5",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.8",
]

[project.scripts]
fim-monitor = "fim.cli:main"

[tool.setuptools.packages.find]
include = ["fim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["fim"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
